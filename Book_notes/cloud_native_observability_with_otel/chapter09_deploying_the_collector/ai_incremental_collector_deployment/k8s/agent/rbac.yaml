apiVersion: v1
kind: ServiceAccount
metadata:
  name: chapter9-agent-collector
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chapter9-agent-collector
rules:
  # The Kubernetes attributes processor keeps a local cache of Pods so it can
  # associate an incoming connection's IP address with its originating Pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Namespace access lets the processor attach namespace metadata. These are
  # read-only discovery permissions; the Collector cannot modify workloads.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chapter9-agent-collector
subjects:
  - kind: ServiceAccount
    name: chapter9-agent-collector
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chapter9-agent-collector
