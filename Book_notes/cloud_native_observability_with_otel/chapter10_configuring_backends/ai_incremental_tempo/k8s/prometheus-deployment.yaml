apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chapter10-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        # The Prometheus image runs as the nobody user and group.
        fsGroup: 65534
      containers:
        - name: prometheus
          # Pin the image so the study example remains reproducible.
          image: prom/prometheus:v3.13.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Prometheus is normally a pull-based scraper. Tempo needs this
            # opt-in endpoint so it can push generated metrics by remote write.
            - --web.enable-remote-write-receiver
            # Exemplars attach representative trace IDs to metric samples.
            - --enable-feature=exemplar-storage
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus
        - name: prometheus-data
          # Metrics persistence is not the concept under study here. A later
          # production design would give Prometheus durable storage.
          emptyDir: {}
