apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: chapter10-tempo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Tempo sends derived metrics to Prometheus through remote write. This
    # ordinary scrape job only gives Prometheus one target for its own health
    # metrics; it is not how the Tempo-derived metrics arrive.
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
