# Pinned chart: grafana/loki 7.0.0 (Loki 3.6.7).
# This intentionally favors a small, understandable homelab deployment over HA.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  analytics:
    reporting_enabled: false

  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true

  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    delete_request_store: filesystem

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  tracing:
    enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: 900MiB
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: local-path
    # Loki is the only copy of these logs, so preserve its claim if the release
    # or StatefulSet is removed accidentally.
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain

# The direct single-binary service is sufficient on this trusted local cluster.
gateway:
  enabled: false

# The default caches are sized for much larger installations.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# Keep the first ingestion scope limited to image-resizer logs.
lokiCanary:
  enabled: false

test:
  enabled: false

sidecar:
  rules:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      prometheus: homelab
    interval: 30s

# Explicitly disable every non-monolithic deployment target.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomCompactor:
  replicas: 0

bloomGateway:
  replicas: 0

minio:
  enabled: false
