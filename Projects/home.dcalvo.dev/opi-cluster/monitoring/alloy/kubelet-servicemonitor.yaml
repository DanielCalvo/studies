apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet
  namespace: kube-system
  labels:
    # Selected by the OPI Alloy cross-cluster metrics pipeline.
    alloy: opi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet
  endpoints:
    - port: https-metrics
      scheme: https
      path: /metrics
      interval: 30s
      # Preserve kubelet labels such as the PVC namespace.
      honorLabels: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # k3s kubelet certificates do not match the endpoint IP addresses.
        # This is acceptable for the trusted home LAN only.
        insecureSkipVerify: true
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpoint_node_name
          targetLabel: node
        - targetLabel: cluster
          replacement: opi
    - port: https-metrics
      scheme: https
      path: /metrics/cadvisor
      interval: 30s
      # Preserve container namespace and pod labels for dashboard joins.
      honorLabels: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpoint_node_name
          targetLabel: node
        - targetLabel: cluster
          replacement: opi
