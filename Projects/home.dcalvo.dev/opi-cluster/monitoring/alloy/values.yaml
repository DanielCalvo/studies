# Pinned chart: grafana/alloy 1.10.0 (Alloy v1.17.0).
crds:
  create: false

alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 512Mi
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: h2c
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      otelcol.receiver.otlp "traces" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          // Send traces across the home LAN to the Alloy gateway in the HP
          // cluster. That gateway forwards them to HP Tempo internally.
          endpoint = "192.168.1.232:4317"

          tls {
            insecure = true
          }
        }
      }

      // Scrapes only ServiceMonitors selected for cross-cluster forwarding.
      prometheus.operator.servicemonitors "image_resizer" {
        // The kubelet Service is owned by k3s in kube-system; the remaining
        // selected ServiceMonitors live in monitoring.
        namespaces = ["monitoring", "kube-system"]

        selector {
          match_expression {
            key      = "alloy"
            operator = "In"
            values   = ["opi"]
          }
        }

        // Record where the samples originated.
        rule {
          target_label = "cluster"
          replacement  = "opi"
        }

        forward_to = [prometheus.remote_write.hp_gateway.receiver]
      }

      // Sends scraped samples to HP Alloy's remote-write-compatible endpoint.
      prometheus.remote_write "hp_gateway" {
        endpoint {
          url = "http://192.168.1.232:9091/api/v1/metrics/write"
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "image_resizer_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "image-resizer"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "image-resizer-api"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "cluster"
          replacement  = "opi"
        }

        rule {
          target_label = "job"
          replacement  = "image-resizer/image-resizer-api"
        }
      }

      loki.source.kubernetes "image_resizer" {
        targets    = discovery.relabel.image_resizer_pods.output
        forward_to = [loki.write.hp_gateway.receiver]
      }

      // Sends OPI log streams to the restricted HP Alloy gateway. The gateway
      // then forwards them to the private Loki Service in the HP cluster.
      loki.write "hp_gateway" {
        endpoint {
          url = "http://192.168.1.232:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    prometheus: opi
    # Select Alloy's own health and remote-write metrics for forwarding to HP.
    alloy: opi
  interval: 30s
