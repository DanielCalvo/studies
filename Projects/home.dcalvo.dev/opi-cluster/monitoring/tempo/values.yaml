# Pinned chart: grafana-community/tempo 2.2.3 (Tempo 2.10.7).
# This is a small single-binary deployment for the arm64 homelab.
replicas: 1

tempo:
  reportingEnabled: false
  memBallastSizeMbs: 0
  retention: 168h

  metricsGenerator:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  extraEnv:
    - name: GOMEMLIMIT
      value: 900MiB

  # Alloy forwards traces with OTLP gRPC. Keep OTLP HTTP available inside the
  # cluster as a convenient option for later experiments.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    prometheus: homelab

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 5Gi
