apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer-traffic-gen
  namespace: image-resizer
  labels:
    app.kubernetes.io/name: image-resizer-traffic-gen
  annotations:
    kubernetes.io/change-cause: "Run steady in-cluster observability traffic"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: image-resizer-traffic-gen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-resizer-traffic-gen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-gen
          image: 192.168.1.225:5000/image-resizer-traffic-gen:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          args:
            - -base-url
            - http://image-resizer-api.image-resizer.svc.cluster.local
            - -rpm
            - "30"
            - -images
            - /test-data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
