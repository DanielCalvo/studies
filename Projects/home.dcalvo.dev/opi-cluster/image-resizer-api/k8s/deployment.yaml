apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer-api
  namespace: image-resizer
  labels:
    app.kubernetes.io/name: image-resizer-api
  annotations:
    kubernetes.io/change-cause: "Initial ARM64 homelab deployment"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: image-resizer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-resizer-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: image-resizer-api
      containers:
        - name: image-resizer-api
          # build-and-deploy.sh replaces the tag while rendering this template.
          image: 192.168.1.225:5000/image-resizer-api:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=image-resizer,deployment.environment.name=homelab"
            # Optional override for CPU-heavy resize concurrency. When omitted,
            # the application uses runtime.GOMAXPROCS(0).
            # - name: MAX_CONCURRENT_RESIZES
            #   value: "2"
            # Keep the Go heap below the container boundary so garbage
            # collection has room to run before Kubernetes enforces the limit.
            - name: GOMEMLIMIT
              value: "1280MiB"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
